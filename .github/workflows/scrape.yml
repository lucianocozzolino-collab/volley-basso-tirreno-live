# Salva questo file come: .github/workflows/scrape.yml (nel tuo repo volley-basso-tirreno-live)
name: Aggiorna risultati FIPAV

on:
  schedule:
    # Ogni 3 ore. Modifica il cron se vuoi una frequenza diversa.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      stagione:
        description: "Stagione da scaricare (es. 2025-2026)"
        required: false
        default: "2025-2026"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa dipendenze
        run: |
          npm init -y
          npm install cheerio playwright
          npx playwright install --with-deps chromium

      - name: Esegui scraper risultati (Basso Tirreno)
        run: node scrape-fipav.js ${{ github.event.inputs.stagione || '2025-2026' }}

      - name: Esegui scraper Volley S3 / Minivolley (Basso Tirreno)
        run: node scrape-s3.js ${{ github.event.inputs.stagione || '2025-2026' }}

      - name: Esegui scraper news (Basso Tirreno)
        run: node scrape-news.js

      - name: Committa i dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Aggiornamento automatico dati $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          git pull --rebase origin main
          git push origin main
