<script>
/* ---------------- DATI REALI (caricati da data/<stagione>.json) ----------------
   Il file viene prodotto dal tuo scraper via GitHub Actions, uno per stagione
   (lancialo con l'anno che vuoi, es. node scrape-fipav.js 2025-2026).
   Finché il file di una stagione non esiste ancora, si usano i dati di
   esempio come fallback, così l'app resta sempre navigabile. */
const STAGIONI_DISPONIBILI = [
  "2025-2026","2026-2027","2024-2025","2023-2024","2022-2023",
  "2021-2022","2020-2021","2019-2020","2018-2019","2017-2018",
  "2016-2017","2015-2016","2014-2015"
];
let stagioneSelezionata = STAGIONI_DISPONIBILI[0];
const PALETTE = ["#22A6B3","#FF6A3D","#FFC857","#3DDC97","#4C8BF5","#C1447E"];

function coloreDa(nome){
  let h = 0;
  for (let i=0;i<nome.length;i++) h = nome.charCodeAt(i) + ((h<<5)-h);
  return PALETTE[Math.abs(h) % PALETTE.length];
}
function inizialiDa(nome){
  return nome.split(/\s+/).filter(w=>w.length>1).map(w=>w[0]).join('').slice(0,3).toUpperCase() || nome.slice(0,3).toUpperCase();
}

let teamsRegistry = {};     // slug -> {slug, name, init, color, roster, seasons: {stagione: Set(categoria)}}
let datiPerStagione = {};   // stagione -> {matches: [...], reale: bool}   (cache, una fetch sola a stagione)
let teams = [];              // per la scheda Squadre: SEMPRE tutte le squadre note, di ogni stagione
let matches = [];            // partite della SOLA stagione scelta nella schermata Partite
let usingRealData = false;

function registraSquadra(nome){
  const s = slug(nome);
  if(!teamsRegistry[s]){
    teamsRegistry[s] = { slug:s, name: nome, city:"", colors:"", init: inizialiDa(nome), color: coloreDa(nome), roster: [], seasons: {} };
  }
  return teamsRegistry[s];
}

function parseStagioneJson(json){
  const nomiSquadre = new Set();
  (json.gironi || []).forEach(g => g.squadre.forEach(s => nomiSquadre.add(s)));
  nomiSquadre.forEach(nome => registraSquadra(nome));

  const localMatches = [];
  let mid = 1;
  (json.gironi || []).forEach(g => {
    const categoria = [g.campionato, g.girone].filter(Boolean).join(' - ') || 'Senza categoria';
    g.calendario.forEach(m => {
      const homeSlug = slug(m.casa), awaySlug = slug(m.ospite);
      if(!teamsRegistry[homeSlug] || !teamsRegistry[awaySlug]) return;
      const giocata = !!m.risultato;
      localMatches.push({
        id: mid++, giornata: m.gara, home: homeSlug, away: awaySlug,
        set: giocata ? m.risultato.replace(/\s/g,'') : null,
        status: giocata ? 'played' : 'upcoming',
        date: m.data, categoria
      });
    });
  });
  return localMatches;
}

function registraStagionePerSquadre(stagione, localMatches){
  localMatches.forEach(m => {
    [m.home, m.away].forEach(s => {
      const t = teamsRegistry[s];
      if(!t) return;
      if(!t.seasons[stagione]) t.seasons[stagione] = new Set();
      t.seasons[stagione].add(m.categoria);
    });
  });
}

// Scarica (una volta sola, con cache) i dati di una stagione. Non tocca "matches"/"teams"
// correnti: serve per costruire il registro squadre e per guardare stagioni passate
// dalla scheda di una squadra, senza cambiare cosa vede la schermata Partite principale.
async function fetchStagione(stagione){
  if(datiPerStagione[stagione]) return datiPerStagione[stagione];
  try{
    const res = await fetch(`./data/${stagione}.json`, {cache:"no-store"});
    if(!res.ok) throw new Error("no data file");
    const json = await res.json();
    const localMatches = parseStagioneJson(json);
    if(localMatches.length === 0) throw new Error("empty");
    registraStagionePerSquadre(stagione, localMatches);
    datiPerStagione[stagione] = { matches: localMatches, reale: true };
  }catch(e){
    datiPerStagione[stagione] = { matches: [], reale: false };
  }
  return datiPerStagione[stagione];
}

function aggiornaElencoSquadreGlobale(){
  teams = Object.values(teamsRegistry).sort((a,b) => a.name.localeCompare(b.name));
}

// Scarica tutte le stagioni elencate (in background, una volta sola) così il registro
// squadre e la ricerca sono sempre completi, indipendentemente da quale stagione stai
// guardando nella schermata Partite.
async function precaricaRegistroSquadre(){
  await Promise.all(STAGIONI_DISPONIBILI.map(s => fetchStagione(s)));
  aggiornaElencoSquadreGlobale();
}

function teamById(s){
  return teamsRegistry[s];
}

async function caricaDatiReali(stagione){
  stagioneSelezionata = stagione || stagioneSelezionata;
  const dati = await fetchStagione(stagioneSelezionata);
  usingRealData = dati.reale;
  if(usingRealData){
    matches = dati.matches;
  } else {
    SAMPLE_TEAMS.forEach(t => { if(!teamsRegistry[t.slug]) teamsRegistry[t.slug] = {...t, seasons:{}}; });
    matches = SAMPLE_MATCHES;
  }
  aggiornaElencoSquadreGlobale();
}

function calcolaClassifica(categoria, datasetPartite){
  const righe = {};
  (datasetPartite || matches)
    .filter(m => m.categoria === categoria && m.status === 'played' && m.set)
    .forEach(m => {
      const parti = m.set.split('-').map(Number);
      if(parti.length !== 2 || isNaN(parti[0]) || isNaN(parti[1])) return;
      const [setCasa, setOspite] = parti;
      [m.home, m.away].forEach(tid => {
        if(!righe[tid]) righe[tid] = {teamId: tid, giocate:0, vinte:0, perse:0, setF:0, setS:0, punti:0};
      });
      const casa = righe[m.home], ospite = righe[m.away];
      casa.giocate++; ospite.giocate++;
      casa.setF += setCasa; casa.setS += setOspite;
      ospite.setF += setOspite; ospite.setS += setCasa;
      if(setCasa > setOspite){
        casa.vinte++; ospite.perse++;
        if(setCasa === 3 && setOspite <= 1){ casa.punti += 3; }
        else { casa.punti += 2; ospite.punti += 1; }
      } else {
        ospite.vinte++; casa.perse++;
        if(setOspite === 3 && setCasa <= 1){ ospite.punti += 3; }
        else { ospite.punti += 2; casa.punti += 1; }
      }
    });
  return Object.values(righe).sort((a,b) =>
    b.punti - a.punti || (b.setF-b.setS) - (a.setF-a.setS) || b.setF - a.setF
  );
}

function renderMatches(){
  const opzioniStagione = STAGIONI_DISPONIBILI.map(s =>
    `<option value="${s}" ${s===stagioneSelezionata?'selected':''}>${s.replace('-','/')}</option>`
  ).join('');

  const categorie = [...new Set(matches.map(m=>m.categoria).filter(Boolean))].sort();
  // Se la categoria selezionata non esiste più (es. cambio stagione), riparti da "tutte"
  if(state.filtroCategoria && !categorie.includes(state.filtroCategoria)) state.filtroCategoria = '';

  const matchesFiltrateCategoria = state.filtroCategoria
    ? matches.filter(m => m.categoria === state.filtroCategoria)
    : matches;

  const giornateDisponibili = [...new Set(matchesFiltrateCategoria.map(m=>m.giornata))]
    .sort((a,b)=> String(a).localeCompare(String(b), undefined, {numeric:true}));
  if(state.filtroGiornata && !giornateDisponibili.includes(state.filtroGiornata)) state.filtroGiornata = '';

  const matchesFiltrate = state.filtroGiornata
    ? matchesFiltrateCategoria.filter(m => m.giornata === state.filtroGiornata)
    : matchesFiltrateCategoria;

  const giornateMostrate = [...new Set(matchesFiltrate.map(m=>m.giornata))]
    .sort((a,b)=> String(b).localeCompare(String(a), undefined, {numeric:true}));

  const selectStyle = "width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.04); color:var(--line); font-size:14px; font-family:'Inter';";

  return `
    <div class="section-title">Calendario &amp; risultati</div>
    <div class="field" style="margin-bottom:10px;">
      <select onchange="cambiaStagione(this.value)" style="${selectStyle}">
        ${opzioniStagione}
      </select>
      ${!usingRealData ? `<p class="note" style="text-align:left; margin-top:8px;">Dati di esempio: la stagione ${stagioneSelezionata.replace('-','/')} non è ancora stata scaricata per questo sito.</p>` : ''}
    </div>
    <div class="field" style="margin-bottom:10px;">
      <select onchange="filtraCategoria(this.value)" style="${selectStyle}">
        <option value="">Tutte le categorie</option>
        ${categorie.map(c => `<option value="${c.replace(/"/g,'&quot;')}" ${c===state.filtroCategoria?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="field" style="margin-bottom:14px;">
      <select onchange="filtraGiornata(this.value)" style="${selectStyle}">
        <option value="">Tutte le giornate</option>
        ${giornateDisponibili.map(g => `<option value="${g}" ${g===state.filtroGiornata?'selected':''}>Giornata ${g}</option>`).join('')}
      </select>
    </div>
    ${state.filtroCategoria ? `
    <div style="display:flex; gap:8px; margin-bottom:14px;">
      <button class="cta-btn" style="flex:1; margin-top:0; ${!state.mostraClassifica ? '' : 'background:transparent; border:1px solid var(--orange);'}" onclick="state.mostraClassifica=false; render();">Calendario</button>
      <button class="cta-btn" style="flex:1; margin-top:0; ${state.mostraClassifica ? '' : 'background:transparent; border:1px solid var(--orange);'}" onclick="state.mostraClassifica=true; render();">Classifica</button>
    </div>` : ''}
    ${state.filtroCategoria && state.mostraClassifica ? renderClassifica(state.filtroCategoria) : (
      matchesFiltrate.length === 0 ? `<div class="empty"><p>Nessuna partita trovata con questi filtri.</p></div>` : giornateMostrate.map(g => `
        <div class="ticker-label" style="margin:14px 0 8px;">GIORNATA ${g}</div>
        ${matchesFiltrate.filter(m=>m.giornata===g).map(m => matchRow(m)).join('')}
      `).join('')
    )}
  `;
}

/* ---------------- ROSE: caricamento, proposta, approvazione ---------------- */
// Le partite e le categorie di una squadra si leggono per stagione dal registro
// (t.seasons), NON dalla stagione attualmente scelta nella schermata Partite:
// così sfogliare una squadra è sempre svincolato da quel filtro.
function stagioniDiSquadra(t){
  return STAGIONI_DISPONIBILI.filter(s => t.seasons[s] && t.seasons[s].size > 0);
}
function categorieDiSquadraStagione(t, stagione){
  return t.seasons[stagione] ? Array.from(t.seasons[stagione]).sort() : [];
}
function matchesDiStagione(stagione){
  const d = datiPerStagione[stagione];
  if(d && d.reale) return d.matches;
  // Se è la stagione "principale" e non ci sono dati reali, mostriamo comunque
  // l'esempio così la scheda squadra resta navigabile anche in demo.
  if(stagione === stagioneSelezionata && !usingRealData) return SAMPLE_MATCHES;
  return [];
}

async function cambiaStagioneSquadra(v){
  state.teamStagioneSelezionata = v;
  state.teamFiltroCategoria = '';
  state.mostraClassificaSquadra = false;
  await fetchStagione(v); // assicura che sia in cache (di solito lo è già dal preload)
  const t = teamById(state.currentTeamId);
  const cats = t ? categorieDiSquadraStagione(t, v) : [];
  state.rosterCategoriaSelezionata = cats[0] || '';
  if(t) caricaRosterSquadra(t, state.rosterCategoriaSelezionata);
  render();
}

function rosterKeyFor(t, categoria){
  return categoria ? `${slug(t.name)}__${slug(categoria)}` : slug(t.name);
}

function caricaRosterSquadra(t, categoria){
  const key = rosterKeyFor(t, categoria);
  db.collection('rosters').doc(key).get().then(doc => {
    rosterCache[key] = doc.exists ? (doc.data().players || []) : [];
    t.roster = rosterCache[key];
    render();
  }).catch(()=>{});

  if(state.user){
    db.collection('roster_submissions')
      .where('uid','==', state.user.uid)
      .where('teamSlug','==', key)
      .get().then(snap => {
        let ultima = null;
        snap.forEach(d => { const v=d.data(); if(!ultima || v.createdAt > ultima.createdAt) ultima = v; });
        myPendingByTeam[key] = ultima;
        render();
      }).catch(()=>{});
  }
}

function cambiaCategoriaRosa(v){
  state.rosterCategoriaSelezionata = v;
  const t = teamById(state.currentTeamId);
  if(t) caricaRosterSquadra(t, v);

}

function toggleRosterForm(){

function inviaPropostaRosa(teamId){
  const t = teamById(teamId);
  const categoria = state.rosterCategoriaSelezionata || '';
  const key = rosterKeyFor(t, categoria);
  if(!state.user){ openLogin('login'); return; }

  const rows = document.querySelectorAll('.roster-form-row');
  const players = [];
  rows.forEach(row => {
    const n = row.querySelector('.rf-num').value.trim();
    const name = row.querySelector('.rf-name').value.trim();
    const role = row.querySelector('.rf-role').value;
    if(name) players.push({n: n || '-', name, role});
  });
  if(players.length === 0){ toast('Inserisci almeno un giocatore'); return; }

  db.collection('roster_submissions').add({
    teamSlug: key,
    teamName: t.name,
    categoria: categoria || '(nessuna categoria specifica)',
    uid: state.user.uid,
    userName: state.user.displayName || state.user.email || 'Utente',
    players,
    status: 'pending',
    createdAt: Date.now()
  }).then(()=>{
    toast('Proposta inviata, in attesa di approvazione');
    caricaRosterSquadra(t, categoria);
  }).catch(err => toast('Errore: ' + err.message));
}

function caricaProposteInAttesa(){
  db.collection('roster_submissions').where('status','==','pending').get().then(snap => {
    pendingSubmissions = [];
    snap.forEach(d => pendingSubmissions.push({id: d.id, ...d.data()}));
    render();
  }).catch(err => toast('Errore admin: ' + err.message));
}

function approvaProposta(subId){
  const sub = pendingSubmissions.find(s => s.id === subId);
  if(!sub) return;
  db.collection('rosters').doc(sub.teamSlug).set({
    players: sub.players, updatedAt: Date.now(), updatedBy: state.user.uid
  }).then(() => db.collection('roster_submissions').doc(subId).update({status:'approved'}))
    .then(()=>{ toast('Rosa approvata e pubblicata'); caricaProposteInAttesa(); })
    .catch(err => toast('Errore: ' + err.message));
}
function rifiutaProposta(subId){
  db.collection('roster_submissions').doc(subId).update({status:'rejected'})
    .then(()=>{ toast('Proposta rifiutata'); caricaProposteInAttesa(); })
    .catch(err => toast('Errore: ' + err.message));
}

        <div class="news-blurb" style="margin-bottom:10px;">${m.testo}</div>
        ${m.risposta ? `<div class="note" style="text-align:left; background:rgba(34,166,179,0.08); padding:10px; border-radius:8px; margin-bottom:10px;"><b style="color:var(--teal);">Tua risposta:</b> ${m.risposta}</div>` : ''}
        <textarea id="risp_${m.id}" placeholder="Scrivi una risposta..." rows="2" style="width:100%; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.04); color:var(--line); font-family:'Inter'; margin-bottom:8px; resize:vertical;">${m.risposta || ''}</textarea>
        <button class="cta-btn" style="width:100%; margin-top:0;" onclick="rispondiMessaggio('${m.id}')">${m.risposta ? 'Aggiorna risposta' : 'Invia risposta'}</button>
      </div>
    `).join(''));
  }

  if(pendingSubmissions.length === 0) caricaProposteInAttesa();
  if(pendingSubmissions.length === 0){
    return tabsHtml + `<div class="empty"><p>Nessuna proposta in attesa al momento.</p></div>`;
  }
  return tabsHtml + `
    ${pendingSubmissions.map(s => `
      <div class="news-card">
        <div class="news-meta"><span class="badge">${s.teamName}</span><span class="news-time">${s.categoria ? s.categoria + ' · ' : ''}di ${s.userName}</span></div>
        ${s.players.map(p => `<div class="player-row" style="padding:6px 0;"><div class="player-num">${p.n}</div><div><div class="player-name">${p.name}</div><div class="player-role">${p.role}</div></div></div>`).join('')}
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="cta-btn" style="flex:1; margin-top:0;" onclick="approvaProposta('${s.id}')">Approva</button>
          <button class="cta-btn" style="flex:1; margin-top:0; background:transparent; border:1px solid var(--danger); color:var(--danger);" onclick="rifiutaProposta('${s.id}')">Rifiuta</button>
        </div>
      </div>
    `).join('')}
  `;
}

function renderTeamDetail(id){
  const t = teamById(id);
  if(!t){
    state.currentTeamId = null;
    return `<div class="empty"><p>Squadra non trovata.</p></div>`;
  }
  const fav = state.favorites.has(id);
  const stagioniTeam = stagioniDiSquadra(t);
  const stagioneTeam = state.teamStagioneSelezionata || stagioniTeam[0] || stagioneSelezionata;
  const teamMatches = matchesDiStagione(stagioneTeam).filter(m => m.home===id || m.away===id);
  const teamNews = news.filter(n => n.team === t.init);
  const selectStyle = "width:100%; padding:11px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.04); color:var(--line); font-size:13.5px; font-family:'Inter';";
  let body = '';

  if(state.teamTab === 'rosa'){
    const categorieTeam = categorieDiSquadraStagione(t, stagioneTeam);
    const key = rosterKeyFor(t, state.rosterCategoriaSelezionata);
    const mine = myPendingByTeam[key];

    body = stagioniTeam.length > 1 ? `
      <div class="field" style="margin-bottom:10px;">
        <select onchange="cambiaStagioneSquadra(this.value)" style="${selectStyle}">
          ${stagioniTeam.map(s => `<option value="${s}" ${s===stagioneTeam?'selected':''}>${s.replace('-','/')}</option>`).join('')}
        </select>
      </div>
    ` : '';

    body += categorieTeam.length > 1 ? `
      <div class="field" style="margin-bottom:14px;">
        <select onchange="cambiaCategoriaRosa(this.value)" style="${selectStyle}">
          ${categorieTeam.map(c => `<option value="${c.replace(/"/g,'&quot;')}" ${c===state.rosterCategoriaSelezionata?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    ` : (categorieTeam.length === 1 ? `<p class="note" style="text-align:left; margin-bottom:12px;">Categoria: ${categorieTeam[0]}</p>` : '');

    body += (t.roster && t.roster.length) ? t.roster.map(p => `
      <div class="player-row">
        <div class="player-num">${p.n}</div>
        <div><div class="player-name">${p.name}</div><div class="player-role">${p.role}</div></div>
      </div>
    `).join('') : `<div class="empty"><p>Rosa non ancora disponibile${categorieTeam.length>1 ? ' per questa categoria' : ''}. Se conosci questa squadra, puoi proporre tu l'elenco giocatori qui sotto — sarà pubblicato dopo l'approvazione.</p></div>`;

    body += `
      <div style="margin-top:16px; border-top:1px solid rgba(255,255,255,0.08); padding-top:14px;">
        ${mine ? `<div class="note" style="text-align:left; margin-bottom:10px;">La tua ultima proposta è: <b style="color:${mine.status==='approved'?'var(--teal)':mine.status==='rejected'?'var(--danger)':'var(--gold)'}">${mine.status==='pending'?'in attesa di approvazione':mine.status==='approved'?'approvata':'rifiutata'}</b></div>` : ''}
        ${state.user ? `
          <div class="tab-item active" style="display:inline-block; cursor:pointer;" onclick="toggleRosterForm()">+ Proponi/aggiorna la rosa</div>
          <div id="rosterFormWrap" class="hidden" style="margin-top:12px;">
            ${renderRosterForm()}
            <button class="primary-btn" onclick="inviaPropostaRosa('${t.slug}')">Invia proposta</button>
            <p class="note">Le proposte vengono verificate da un amministratore prima di essere pubblicate.</p>
          </div>
        ` : `<p class="note">Accedi per proporre la rosa di questa squadra.</p>`}
      </div>
    `;
  } else if(state.teamTab === 'partite'){
    const categorieTeam = [...new Set(teamMatches.map(m=>m.categoria).filter(Boolean))].sort();
    if(state.teamFiltroCategoria && !categorieTeam.includes(state.teamFiltroCategoria)) state.teamFiltroCategoria = '';
    const teamMatchesFiltrate = state.teamFiltroCategoria
      ? teamMatches.filter(m => m.categoria === state.teamFiltroCategoria)
      : teamMatches;

    body = `
      <div class="field" style="margin-bottom:10px;">
        <select onchange="cambiaStagioneSquadra(this.value)" style="${selectStyle}">
          ${STAGIONI_DISPONIBILI.map(s => `<option value="${s}" ${s===stagioneTeam?'selected':''}>${s.replace('-','/')}${!stagioniTeam.includes(s) ? ' (nessun dato)' : ''}</option>`).join('')}
        </select>
      </div>
      ${categorieTeam.length > 1 ? `
      <div class="field" style="margin-bottom:14px;">
        <select onchange="state.teamFiltroCategoria=this.value; state.mostraClassificaSquadra=false; render();" style="${selectStyle}">
          <option value="">Tutte le categorie</option>
          ${categorieTeam.map(c => `<option value="${c.replace(/"/g,'&quot;')}" ${c===state.teamFiltroCategoria?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>` : ''}
      ${state.teamFiltroCategoria ? `
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="cta-btn" style="flex:1; margin-top:0; ${!state.mostraClassificaSquadra ? '' : 'background:transparent; border:1px solid var(--orange);'}" onclick="state.mostraClassificaSquadra=false; render();">Calendario</button>
        <button class="cta-btn" style="flex:1; margin-top:0; ${state.mostraClassificaSquadra ? '' : 'background:transparent; border:1px solid var(--orange);'}" onclick="state.mostraClassificaSquadra=true; render();">Classifica</button>
      </div>` : ''}
      ${state.teamFiltroCategoria && state.mostraClassificaSquadra ? renderClassifica(state.teamFiltroCategoria, matchesDiStagione(stagioneTeam)) :
        (teamMatchesFiltrate.length ? teamMatchesFiltrate.map(m => matchRow(m)).join('') : `<div class="empty"><p>Nessuna partita per questa combinazione di stagione/categoria.</p></div>`)}
    `;
  } else {
    body = teamNews.length ? teamNews.map(n => `
      <div class="news-card">
        <div class="news-meta"><span class="badge">${n.team}</span><span class="news-time">${n.time}</span></div>
        <div class="news-title">${n.title}</div>
        <div class="news-blurb">${n.blurb}</div>
      </div>
    `).join('') : `<div class="empty"><p>Nessuna notizia recente per questa squadra.</p></div>`;
  }

  return `
    <div class="back-link" onclick="backFromTeam()">← Torna alle squadre</div>
    <div class="team-header">
      <div class="team-badge" style="background:${t.color}22; color:${t.color};">${t.init}</div>
      <div>
        <h2>${t.name}</h2>
        <div class="sub">${[t.city, t.colors ? 'Colori ' + t.colors : ''].filter(Boolean).join(' · ') || 'FIPAV Basso Tirreno'}</div>
      </div>
      <button class="star-btn" style="position:static; margin-left:auto; background:rgba(255,255,255,0.06); color:${fav?'var(--gold)':'var(--slate)'}" onclick="toggleFavorite('${t.slug}', event)">
        ${fav ? icons.starFill : icons.star}
      </button>
    </div>
    <div class="tabs">
      <div class="tab-item ${state.teamTab==='rosa'?'active':''}" onclick="setTeamTab('rosa')">Rosa</div>
      <div class="tab-item ${state.teamTab==='partite'?'active':''}" onclick="setTeamTab('partite')">Partite</div>
      <div class="tab-item ${state.teamTab==='notizie'?'active':''}" onclick="setTeamTab('notizie')">Notizie</div>
    </div>
    ${body}
  `;
}

/* ---------------- INIT ---------------- */
auth.onAuthStateChanged(user => {
  state.user = user;
  if(user) caricaPreferiti(user.uid);
  else state.favorites = new Set();
  renderProfileSlot();
  render();
});

Promise.all([caricaDatiReali("2025-2026"), caricaNewsReali(), precaricaRegistroSquadre()]).then(() => {
  renderProfileSlot();
  render();
  if(!usingRealData){
    toast(`Dati di esempio (data/${stagioneSelezionata}.json non ancora disponibile)`);
  }
});
</script>
</body>
</html>
